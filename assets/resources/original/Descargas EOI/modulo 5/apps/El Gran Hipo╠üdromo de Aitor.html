<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hipódromo de Aitor</title>
<style>
  :root {
    --bg:#f7f1e8;
    --ink:#271b16;
    --muted:#7a665a;
    --card:#fffaf2;
    --line:#d7c5ae;
    --green:#3c7a45;
    --gold:#c8912f;
    --red:#c44c45;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top,#fffaf0 0,#f7f1e8 45%,#eadcc8 100%);
    color:var(--ink); min-height:100vh; padding:20px;
  }
  .app{max-width:1050px;margin:0 auto}
  .hero{display:grid;grid-template-columns:1fr 170px;gap:16px;align-items:center;margin-bottom:16px}
  .panel{background:rgba(255,250,242,.92);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 50px rgba(77,50,24,.12)}
  h1{font-size:clamp(30px,5vw,56px);line-height:.95;margin:0 0 8px;letter-spacing:-.05em}
  .sub{margin:0;color:var(--muted);font-size:16px}
  .teacher{text-align:center}
  .teacher img{width:120px;height:120px;object-fit:cover;border-radius:50%;border:5px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .badge{display:inline-block;margin-top:8px;background:#271b16;color:#fff;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}
  .controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
  label{font-size:13px;font-weight:800;color:var(--muted);display:block;margin-bottom:5px}
  select,input,button{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;background:#fff;color:var(--ink)}
  button{border:0;background:linear-gradient(135deg,#241815,#725035);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 12px 24px rgba(39,27,22,.18)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .status{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
  .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-weight:800}
  .track{position:relative;background:linear-gradient(90deg,#5d9d5d,#4c8c4f);border-radius:24px;overflow:hidden;padding:20px 18px 20px 18px;border:6px solid #8a613d;box-shadow:inset 0 0 0 4px rgba(255,255,255,.25)}
  .finish{position:absolute;right:72px;top:0;bottom:0;width:10px;background:repeating-linear-gradient(45deg,#fff 0 10px,#111 10px 20px);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
  .lane{position:relative;height:62px;border-bottom:2px dashed rgba(255,255,255,.42)}
  .lane:last-child{border-bottom:0}
  .horse{position:absolute;left:0;top:10px;width:74px;height:40px;transition:left .08s linear;display:flex;align-items:center;gap:5px;font-size:32px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.22))}
  .horse small{font-size:12px;background:rgba(255,255,255,.88);border-radius:999px;padding:4px 7px;color:#271b16;font-weight:900;white-space:nowrap}
  .leaderboard{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;font-weight:900;min-height:66px}
  .card span{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-top:3px}
  .result{margin-top:16px;padding:18px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:20px;font-weight:900;text-align:center;display:none}
  .result.win{background:#f2ffe8;border-color:#95c77f}
  .result.lose{background:#fff1ef;border-color:#df9b93}
  @media(max-width:760px){.hero{grid-template-columns:1fr}.teacher{display:flex;align-items:center;gap:12px;text-align:left}.teacher img{width:82px;height:82px}.controls{grid-template-columns:1fr}.leaderboard{grid-template-columns:1fr 1fr}body{padding:12px}}
</style>
</head>

<script>
const horses = [
  { name:'Gerard Galopador', emoji:'🐎', pos:0, speed:0 },
  { name:'Anna A Toda Brida', emoji:'🏇', pos:0, speed:0 },
  { name:'Paola Pura Sangre', emoji:'🐴', pos:0, speed:0 },

  opt.textContent = h.name;
  select.appendChild(opt);

  const lane = document.createElement('div');
  lane.className = 'lane';
  lane.innerHTML = `<div class="horse" id="horse-${i}"><span>${h.emoji}</span><small>${h.name}</small></div>`;
  track.appendChild(lane);
});

function renderBoard(){
  leaderboard.innerHTML = '';
  [...horses].sort((a,b)=>b.pos-a.pos).forEach((h,idx)=>{
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `${idx+1}º ${h.name} <span>${Math.round(h.pos)}%</span>`;
    leaderboard.appendChild(card);
  });
}
renderBoard();

  horses.forEach((h,i)=>{
    h.pos = 0;
    h.speed = Math.random()*1.4 + .6;
    document.getElementById(`horse-${i}`).style.left = '0%';
  });
  result.style.display='none';
  result.className='result';
  renderBoard();
}

function stepRace(){
  horses.forEach((h,i)=>{
    const burst = Math.random() < .12 ? Math.random()*3.2 : 0;
    const hesitation = Math.random() < .08 ? -Math.random()*1.5 : 0;
    h.pos += h.speed + Math.random()*1.9 + burst + hesitation;
    h.pos = Math.max(0, Math.min(100, h.pos));
    document.getElementById(`horse-${i}`).style.left = `calc(${h.pos}% - ${h.pos * .74}px)`;
  });
  renderBoard();
  const winner = horses.find(h=>h.pos >= 100);
  if(winner) finishRace(winner);
}

function finishRace(winner){
  clearInterval(timer);
  racing = false;
  startBtn.disabled = false;
  startBtn.textContent = 'Revancha';

  const chosen = horses[Number(select.value)];
  const coins = Math.max(1, Number(document.getElementById('coins').value || 1));
  const won = chosen === winner;
  wallet += won ? coins*3 : -coins;
  wallet = Math.max(0, wallet);
  walletEl.textContent = `Bote ficticio: ${wallet} monedas`;

  result.style.display='block';
  result.classList.add(won ? 'win' : 'lose');
  result.innerHTML = won
    ? `🎉 ¡Victoria! Ganó <b>${winner.name}</b>. Aitor aprueba esta apuesta.`
    : `😅 Ganó <b>${winner.name}</b>. Tú apostaste por <b>${chosen.name}</b>. Aitor pide revancha.`;
  message.textContent = won ? 'Apuesta ganadora.' : 'La próxima carrera será tuya.';
}

startBtn.addEventListener('click',()=>{
  if(racing) return;
  resetRace();
  racing = true;
  startBtn.disabled = true;
  message.textContent = '¡Y arrancan los caballos!';
  timer = setInterval(stepRace, 90);
});
</script>
</body>
</html>
